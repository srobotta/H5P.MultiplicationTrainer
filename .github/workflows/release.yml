name: Build and attach .h5p to release

on:
  release:
    types: [published]
  # Allows a manual run from the Actions tab (does not upload to a release).
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build the .h5p package
        run: python build-multiplication-trainer.py

      - name: Find the built file
        id: artifact
        run: echo "path=$(ls -1 *.h5p | head -n1)" >> "$GITHUB_OUTPUT"

      - name: Upload as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: multiplication-trainer-h5p
          path: ${{ steps.artifact.outputs.path }}

      - name: Attach to the GitHub release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "${{ steps.artifact.outputs.path }}" --clobber
